<!DOCTYPE html>
<html>
<head>
  <title>Shadow — Digital Twin Control</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 40px; max-width: 600px; margin: auto; }
    h1 { color: #4fc3f7; }
    input { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: none; margin-bottom: 12px; }
    button { padding: 12px 24px; font-size: 16px; background: #4fc3f7; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #29b6f6; }
    button:disabled { background: #555; cursor: not-allowed; }
    #status { margin-top: 20px; padding: 16px; background: #222; border-radius: 6px; white-space: pre-wrap; min-height: 60px; }
    .quick { margin: 4px 6px 4px 0; padding: 8px 14px; font-size: 13px; background: #333; }
    .quick:hover { background: #444; }
  </style>
</head>
<body>
  <h1>Shadow — Digital Twin</h1>
  <input id="instruction" placeholder="e.g. open notepad and type hello" />
  <button onclick="runTask()">Run Task</button>
  

  <div style="margin-top: 16px;">
    <button class="quick" onclick="quickRun('open notepad and type hello from the twin')">Open Notepad Demo</button>
    <button class="quick" onclick="quickRun('check notion')">Check Notion</button>
    <button class="quick" onclick="quickRun('check slack')">Check Slack</button>
    <button class="quick" onclick="quickRun('check my calendar')">Check Calendar</button>
  </div>

  <div id="status">Ready.</div>

  <script>
    async function runTask() {
      const instruction = document.getElementById('instruction').value.trim();
      if (!instruction) return;
      await sendTask(instruction);
    }

    async function quickRun(text) {
      document.getElementById('instruction').value = text;
      await sendTask(text);
    }

    async function sendTask(instruction) {
      const status = document.getElementById('status');
      status.textContent = 'Running: ' + instruction + ' ...';
      try {
        const resp = await fetch(
          'http://localhost:8000/start-task?instruction=' + encodeURIComponent(instruction),
          { method: 'POST' }
        );
        const data = await resp.json();
        status.textContent = 'Result:\n' + JSON.stringify(data, null, 2);
      } catch (e) {
        status.textContent = 'Error: ' + e;
      }
    }
  </script>
</body>
</html>
